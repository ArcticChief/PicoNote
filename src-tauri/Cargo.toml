[package]
name = "piconote"
version = "1.0.0"
description = "PicoNote Markdown Editor"
authors = ["you"]
edition = "2021"

[lib]
name = "piconote_lib"

crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

